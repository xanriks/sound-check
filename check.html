<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="color-scheme" content="dark">
<title>Check — Sound Check</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Karla:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10131a;--chassis:#191e29;--tungsten:#f2a03d;--signal:#5cd6c0;
  --fault:#c4574e;--cream:#ede7da;--dim:#6b7385;
  --display:"Space Grotesk",system-ui,sans-serif;--body:"Karla",system-ui,sans-serif;
  --readout:"DM Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--cream);font-family:var(--body);
  line-height:1.55;padding:2rem 1.2rem 4rem}
.wrap{max-width:42rem;margin:0 auto}
.eyebrow{font-family:var(--readout);font-size:.7rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--tungsten)}
h1{font-family:var(--display);font-size:clamp(1.9rem,6vw,2.6rem);line-height:1;
  letter-spacing:-.02em;margin:.4rem 0 .6rem}
.blurb{color:var(--dim);margin-bottom:1.8rem}
.check{display:flex;gap:.9rem;padding:.9rem 0;border-bottom:1px solid #232a3a;align-items:flex-start}
.dot{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;
  font-size:.85rem;font-weight:700;background:#232a3a;color:var(--dim);margin-top:.15rem}
.dot.pass{background:rgba(92,214,192,.18);color:var(--signal)}
.dot.fail{background:rgba(196,87,78,.2);color:#e2938c}
.dot.warn{background:rgba(242,160,61,.18);color:var(--tungsten)}
.body{flex:1;min-width:0}
.name{font-weight:700}
.detail{color:var(--dim);font-size:.92rem}
.fix{margin-top:.5rem;padding:.6rem .8rem;border-left:2px solid var(--tungsten);
  background:rgba(242,160,61,.07);border-radius:0 6px 6px 0;font-size:.92rem}
code{font-family:var(--readout);font-size:.86em;background:#0b0e14;
  border:1px solid #2b3244;border-radius:4px;padding:.05rem .3rem;word-break:break-all}
.verdict{margin-top:1.6rem;padding:1.1rem;border-radius:12px;
  background:var(--chassis);border:1px solid #2b3244}
.verdict h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.4rem}
.spin{color:var(--dim);font-family:var(--readout);font-size:.85rem}
</style>
</head>
<body><div class="wrap">
  <span class="eyebrow">sound check</span>
  <h1>What's broken?</h1>
  <p class="blurb">Tests every layer in order and stops guessing. This page must live in the same
  folder as the app, and you have to open it from your GitHub Pages address — not by
  double-clicking it.</p>
  <div id="out"></div>
  <p class="spin" id="spin">Running…</p>
  <div id="verdict"></div>
</div>

<script type="module">
const out = document.getElementById("out");
let firstFailure = null;

function log(state, name, detail, fix) {
  if (state === "fail" && !firstFailure) firstFailure = name;
  out.insertAdjacentHTML("beforeend", `
    <div class="check">
      <div class="dot ${state}">${state === "pass" ? "✓" : state === "warn" ? "!" : "✕"}</div>
      <div class="body">
        <div class="name">${name}</div>
        <div class="detail">${detail}</div>
        ${fix ? `<div class="fix">${fix}</div>` : ""}
      </div>
    </div>`);
}

const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function grab(path) {
  const res = await fetch(path + "?cachebust=" + Date.now());
  if (!res.ok) throw new Error(res.status + " " + res.statusText);
  return res.text();
}

(async function run() {

  /* 1 — where are we? */
  if (location.protocol === "file:") {
    log("fail", "How this page was opened",
      "Straight from your hard drive.",
      "Browsers block most of the app this way. Upload these files to your repo and open " +
      "<code>https://yourname.github.io/sound-check/check.html</code> instead. Nothing below " +
      "this line will be accurate.");
  } else {
    log("pass", "How this page was opened", "Served over " + location.protocol + " — correct.");
  }

  /* 2 — are the files actually there? */
  for (const [file, needed] of [["styles.css", true], ["app.js", true], ["index.html", true]]) {
    try {
      const text = await grab(file);
      log("pass", file + " is published", text.length.toLocaleString() + " bytes.");
      if (file === "app.js") {
        const fresh = text.includes("blockStart");
        log(fresh ? "pass" : "warn", "app.js is the latest version",
          fresh ? "Contains the newer error reporting."
                : "This is an older copy.",
          fresh ? "" : "Either the upload didn't replace the old file, or your browser cached it. " +
                       "Re-upload it, wait a minute for Pages to rebuild, then hard-refresh with " +
                       "<code>Ctrl+Shift+R</code> (<code>Cmd+Shift+R</code> on a Mac).");
      }
    } catch (err) {
      log("fail", file + " is published", esc(err.message),
        "The file isn't at that address. Check it's in the <b>root</b> of the repo, not inside a " +
        "folder, and that the name matches exactly — GitHub Pages is case-sensitive, so " +
        "<code>Styles.css</code> will not match <code>styles.css</code>.");
    }
  }

  try {
    await grab("songs.csv");
    log("pass", "songs.csv is published", "Found.");
  } catch {
    log("warn", "songs.csv is published", "Not found.",
      "Not a problem yet — the app falls back to one built-in track so you can test everything " +
      "else. Upload it when you're ready.");
  }

  /* 3 — is the Firebase config real? */
  let cfg = null;
  try {
    cfg = (await import("./firebase-config.js?cachebust=" + Date.now())).firebaseConfig;
    log("pass", "firebase-config.js loads", "No syntax errors.");
  } catch (err) {
    log("fail", "firebase-config.js loads", esc(err.message),
      "Usually a missing comma or a curly quote from pasting. Open the file on GitHub and check " +
      "it still starts with <code>export const firebaseConfig = {</code> and ends with " +
      "<code>};</code>");
  }

  if (cfg) {
    const raw = JSON.stringify(cfg);
    if (raw.includes("PASTE")) {
      log("fail", "Firebase config is filled in", "Still contains the placeholder text.",
        "Copy the real config from Firebase → gear icon → Project settings → Your apps, and paste " +
        "it over the whole object. Part 3 of SETUP.md.");
    } else if (/sound-check-1234|YOUR-PROJECT|example\.firebaseio/.test(raw)) {
      log("fail", "Firebase config is filled in",
        "This is the example config from the setup guide, not your own project.",
        "<code>sound-check-1234</code> is a made-up project that doesn't exist, so Firebase will " +
        "sit there retrying forever. Go to Firebase → gear icon → <b>Project settings</b> → scroll " +
        "to <b>Your apps</b>, and copy the real <code>firebaseConfig</code>. Your project ID will " +
        "have a random suffix like <code>sound-check-a4f92</code>.");
    } else if (!cfg.databaseURL) {
      log("fail", "Firebase config is filled in", "There's no <code>databaseURL</code> line.",
        "This happens when the web app was registered before the database existed. Open Realtime " +
        "Database in Firebase, copy the URL at the top of the <b>Data</b> tab, and add it as " +
        "<code>databaseURL: \"...\",</code>");
    } else {
      log("pass", "Firebase config is filled in", esc(cfg.databaseURL));
    }
  }

  /* 4 — can we reach the database? */
  if (cfg && cfg.databaseURL && !JSON.stringify(cfg).includes("PASTE")) {
    try {
      const app = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const rtdb = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
      log("pass", "Firebase library downloads", "Reached gstatic.com.");

      const db = rtdb.getDatabase(app.initializeApp(cfg));
      log("pass", "Database starts up", "No errors.");

      const code = "ZZ" + Math.random().toString(36).slice(2, 5).toUpperCase();
      const probe = rtdb.ref(db, `rooms/${code}/meta`);

      const timeout = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("TIMED_OUT")), 12000));

      await Promise.race([
        rtdb.set(probe, { host: "diagnostic", status: "lobby", createdAt: Date.now() }),
        timeout
      ]);
      const back = await Promise.race([rtdb.get(probe), timeout]);
      rtdb.remove(rtdb.ref(db, `rooms/${code}`)).catch(() => {});

      if (back.exists()) {
        log("pass", "Writing and reading a room", "Wrote to " + code + ", read it back, cleaned up.");
      } else {
        log("fail", "Writing and reading a room", "The write went through but read back empty.");
      }
    } catch (err) {
      const m = String(err && err.message || err);
      if (m === "handled") { /* already reported above */ }
      else {
      const denied = /permission|PERMISSION_DENIED/i.test(m);
      if (m === "TIMED_OUT") {
        log("fail", "Writing and reading a room",
          "No response after 12 seconds.",
          "Firebase never errors when the database doesn't exist — it just retries silently. " +
          "Almost always this means the <code>databaseURL</code> points somewhere real-looking " +
          "but wrong. Check it character for character against the URL at the top of the " +
          "<b>Data</b> tab in Realtime Database.");
        throw new Error("handled");
      }
      log("fail", "Writing and reading a room", esc(m),
        denied
          ? "The security rules are still in locked mode. In Firebase open <b>Realtime Database → " +
            "Rules</b>, paste in the contents of <code>database.rules.json</code>, and click " +
            "<b>Publish</b>. Part 1, step 5 of SETUP.md."
          : "Two things cause this. Either you created <b>Cloud Firestore</b> instead of " +
            "<b>Realtime Database</b> — they're different products and this app only speaks the " +
            "second one — or the <code>databaseURL</code> points at a database that doesn't exist.");
      }
    }
  }

  /* verdict */
  const spin = document.getElementById("spin");
  if (spin) spin.remove();
  document.getElementById("verdict").innerHTML = firstFailure
    ? `<div class="verdict"><h2>Start here</h2>
         <p>The first thing that failed is <b>${esc(firstFailure)}</b>. Fix that one and run this
         page again — later failures are often just knock-on effects.</p></div>`
    : `<div class="verdict"><h2>Everything passed</h2>
         <p>Files are published, Firebase is connected, and rooms can be written and read. Open
         <code>index.html</code> and starting a room should work. If it still doesn't, hard-refresh
         with <code>Ctrl+Shift+R</code> to clear a cached copy of the old app.js.</p></div>`;
})();
</script>
</body></html>
